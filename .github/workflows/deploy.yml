# Publiceert de reader naar de GitHub Pages van DEZE repository.
#
# Let op bij een fork (bijv. KarelTestSpecial/boek, een fork van profdrkdc/boek):
# mergen naar `main` publiceert op de Pages van de fork zelf
# (https://kareltestspecial.github.io/boek/), nooit op de Pages van de upstream.
# Eenmalig instellen door iemand met beheerrechten, anders faalt de deploy-stap
# met "Get Pages site failed. Error: Not Found":
#   1. Settings -> Pages -> Build and deployment -> Source: GitHub Actions
#   2. Actions-tab -> workflows enable (staan standaard uit in een fork)
#   3. Settings -> Actions -> General -> Workflow permissions -> Read and write
# `enablement: true` op configure-pages is hiervoor geen oplossing: dat vereist
# een token met administration:write, wat GITHUB_TOKEN niet kan krijgen.

name: Deploy Competente Lezer Platform

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 01-PLATFORM/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: 01-PLATFORM

      - name: Build
        run: pnpm build
        working-directory: 01-PLATFORM

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './01-PLATFORM/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
